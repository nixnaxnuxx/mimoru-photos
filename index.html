<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff3f77" />
  <title>Mimoru</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow">IEEE RO-MAN 2026 • Robot Design Competition</div>
        <h1>Meet <span>Mimoru</span></h1>
        <p>Take a photo with Mimoru, save it to the shared gallery, and browse everyone’s moments.</p>
      </div>
      <img src="assets/mimoru.png" alt="Mimoru quadruped robot" class="hero-robot" />
    </section>

    <nav class="tabs" aria-label="Photo booth sections">
      <button class="tab is-active" data-tab="camera" type="button">Take Photo</button>
      <button class="tab" data-tab="gallery" type="button">Gallery</button>
    </nav>

    <section id="cameraPanel" class="panel">
      <div class="camera-card">
        <div class="camera-wrap">
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="captureCanvas" hidden></canvas>
          <div id="cameraPlaceholder" class="camera-placeholder">
            <div class="camera-icon">📷</div>
            <p>Tap <strong>Start Camera</strong></p>
          </div>
        </div>

        <div class="camera-actions">
          <button id="startCameraBtn" class="btn btn-secondary" type="button">Start Camera</button>
          <button id="switchCameraBtn" class="btn btn-secondary" type="button" disabled>Switch</button>
          <button id="captureBtn" class="btn btn-primary" type="button" disabled>Take Photo</button>
        </div>

        <div id="uploadStatus" class="status" aria-live="polite"></div>
        <p class="helper">Camera access requires HTTPS or localhost.</p>
      </div>

      <section id="previewSection" class="preview-section" hidden>
        <h2>Your photo</h2>
        <img id="previewImage" alt="Captured Mimoru photo preview" />
        <div class="preview-actions">
          <button id="retakeBtn" class="btn btn-secondary" type="button">Retake</button>
          <button id="uploadBtn" class="btn btn-primary" type="button">Save to Gallery</button>
        </div>
      </section>

      <div class="consent">
        <input id="consentCheck" type="checkbox" />
        <label for="consentCheck">I understand this photo will be visible in the public event gallery.</label>
      </div>
    </section>

    <section id="galleryPanel" class="panel" hidden>
      <div class="gallery-heading">
        <div>
          <div class="eyebrow">Shared moments</div>
          <h2>Mimoru Photo Gallery</h2>
        </div>
        <button id="refreshGalleryBtn" class="btn btn-secondary compact" type="button">Refresh</button>
      </div>

      <div id="galleryStatus" class="status" aria-live="polite"></div>
      <div id="galleryGrid" class="gallery-grid"></div>
      <button id="loadMoreBtn" class="btn btn-secondary load-more" type="button" hidden>Load More</button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
<script src="config.js?v=7"></script>
<script src="app.js?v=7"></script>
</html>
